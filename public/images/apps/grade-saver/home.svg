<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <rect x="200" y="100" width="880" height="540" rx="22" fill="#ffffff" opacity="0.98"/>
    <rect x="200" y="100" width="880" height="54" rx="22" fill="#f5f3ff"/>
    <rect x="200" y="126" width="880" height="28" fill="#f5f3ff"/>
    <circle cx="228" cy="127" r="7" fill="#ff5f57"/>
    <circle cx="250" cy="127" r="7" fill="#febc2e"/>
    <circle cx="272" cy="127" r="7" fill="#28c840"/>
    <rect x="560" y="116" width="170" height="22" rx="11" fill="#ffffff"/>
    <text x="645" y="132" text-anchor="middle" font-size="12" fill="#9ca3af">gradesaver.app/calculator</text>

    <rect x="200" y="154" width="76" height="486" fill="#f5f3ff"/>
    <rect x="218" y="178" width="40" height="40" rx="12" fill="#8b5cf6"/>
    <rect x="228" y="186" width="20" height="8" rx="4" fill="#ffffff"/>
    <rect x="228" y="200" width="20" height="8" rx="4" fill="#ffffff"/>
    <rect x="218" y="234" width="40" height="40" rx="12" fill="#ddd6fe" opacity="0.6"/>
    <rect x="228" y="244" width="20" height="8" rx="4" fill="#8b5cf6" opacity="0.7"/>
    <rect x="228" y="258" width="20" height="8" rx="4" fill="#8b5cf6" opacity="0.7"/>

    <g transform="translate(360, 190)">
      <text font-size="16" font-weight="700" fill="#111827">Grade calculator</text>
      <text y="26" font-size="13" fill="#9ca3af">Add your scores to see what you need to pass</text>

      <g transform="translate(0, 54)">
        <rect y="0" width="300" height="46" rx="12" fill="#f5f3ff"/>
        <rect x="170" y="8" width="120" height="30" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
        <text x="230" y="28" text-anchor="middle" font-size="13" fill="#4c1d95">Quiz 1</text>
        <text x="16" y="29" font-size="13" fill="#6b7280">Name</text>

        <rect y="56" width="300" height="46" rx="12" fill="#f5f3ff"/>
        <rect x="170" y="64" width="120" height="30" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
        <text x="230" y="84" text-anchor="middle" font-size="13" fill="#6b7280">80 / 100</text>
        <text x="16" y="85" font-size="13" fill="#6b7280">Score</text>

        <rect y="112" width="300" height="46" rx="12" fill="#f5f3ff"/>
        <rect x="170" y="120" width="120" height="30" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
        <text x="230" y="140" text-anchor="middle" font-size="13" fill="#6b7280">20%</text>
        <text x="16" y="141" font-size="13" fill="#6b7280">Weight</text>

        <rect x="0" y="178" width="300" height="42" rx="21" fill="url(#accent)"/>
        <text x="150" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Add another grade</text>
      </g>

      <g transform="translate(340, 54)">
        <text font-size="13" font-weight="600" fill="#111827">Current standing</text>
        <rect y="14" width="320" height="180" rx="18" fill="#f5f3ff"/>
        <text x="24" y="52" font-size="14" fill="#6b7280">Running average</text>
        <text x="24" y="92" font-size="40" font-weight="700" fill="#7c3aed">86.4</text>
        <text x="24" y="118" font-size="13" fill="#9ca3af">out of 100</text>
        <rect x="24" y="140" width="272" height="10" rx="5" fill="#e9d5ff"/>
        <rect x="24" y="140" width="220" height="10" rx="5" fill="url(#accent)"/>

        <rect y="210" width="320" height="86" rx="16" fill="#fff7ed"/>
        <text x="20" y="244" font-size="14" font-weight="600" fill="#c2410c">You need 62% on the final exam</text>
        <text x="20" y="268" font-size="13" fill="#b45309">to finish with a passing grade of 75.</text>
      </g>
    </g>
  </g>
</svg>
