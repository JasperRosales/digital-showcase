<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <rect x="200" y="100" width="880" height="540" rx="22" fill="#ffffff" opacity="0.98"/>
    <rect x="200" y="100" width="880" height="54" rx="22" fill="#f5f3ff"/>
    <rect x="200" y="126" width="880" height="28" fill="#f5f3ff"/>
    <circle cx="228" cy="127" r="7" fill="#ff5f57"/>
    <circle cx="250" cy="127" r="7" fill="#febc2e"/>
    <circle cx="272" cy="127" r="7" fill="#28c840"/>
    <rect x="560" y="116" width="170" height="22" rx="11" fill="#ffffff"/>
    <text x="645" y="132" text-anchor="middle" font-size="12" fill="#9ca3af">gradesaver.app/subjects</text>

    <g transform="translate(360, 180)">
      <text font-size="16" font-weight="700" fill="#111827">My subjects</text>
      <text y="26" font-size="13" fill="#9ca3af">Track how each class is going</text>

      <g transform="translate(0, 54)">
        <rect y="0" width="460" height="64" rx="14" fill="#f5f3ff"/>
        <rect x="14" y="14" width="36" height="36" rx="10" fill="#8b5cf6"/>
        <text x="32" y="38" text-anchor="middle" font-size="14" fill="#ffffff">M</text>
        <text x="64" y="38" font-size="14" font-weight="600" fill="#111827">Math 101</text>
        <text x="350" y="38" font-size="14" font-weight="700" fill="#7c3aed">91.0</text>

        <rect y="76" width="460" height="64" rx="14" fill="#f5f3ff"/>
        <rect x="14" y="90" width="36" height="36" rx="10" fill="#ec4899"/>
        <text x="32" y="114" text-anchor="middle" font-size="14" fill="#ffffff">E</text>
        <text x="64" y="114" font-size="14" font-weight="600" fill="#111827">English</text>
        <text x="350" y="114" font-size="14" font-weight="700" fill="#db2777">88.2</text>

        <rect y="152" width="460" height="64" rx="14" fill="#f5f3ff"/>
        <rect x="14" y="166" width="36" height="36" rx="10" fill="#0ea5e9"/>
        <text x="32" y="190" text-anchor="middle" font-size="14" fill="#ffffff">S</text>
        <text x="64" y="190" font-size="14" font-weight="600" fill="#111827">Science</text>
        <text x="350" y="190" font-size="14" font-weight="700" fill="#0284c7">74.5</text>
      </g>

      <g transform="translate(0, 292)">
        <rect x="0" y="0" width="460" height="86" rx="16" fill="#fff7ed"/>
        <text x="20" y="34" font-size="14" font-weight="600" fill="#c2410c">Heads up — Science is at risk</text>
        <text x="20" y="58" font-size="13" fill="#b45309">Score at least 78% on the next test to stay above 75.</text>
      </g>
    </g>
  </g>
</svg>
