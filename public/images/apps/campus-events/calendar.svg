<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <rect x="200" y="100" width="880" height="540" rx="22" fill="#ffffff" opacity="0.98"/>
    <rect x="200" y="100" width="880" height="54" rx="22" fill="#ecfdf5"/>
    <rect x="200" y="126" width="880" height="28" fill="#ecfdf5"/>
    <circle cx="228" cy="127" r="7" fill="#ff5f57"/>
    <circle cx="250" cy="127" r="7" fill="#febc2e"/>
    <circle cx="272" cy="127" r="7" fill="#28c840"/>
    <rect x="560" y="116" width="170" height="22" rx="11" fill="#ffffff"/>
    <text x="645" y="132" text-anchor="middle" font-size="12" fill="#9ca3af">campusevents.app/event</text>

    <g transform="translate(340, 180)">
      <rect x="0" y="0" width="360" height="360" rx="22" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="20" y="20" width="120" height="28" rx="14" fill="#d1fae5"/>
      <text x="80" y="39" text-anchor="middle" font-size="12" fill="#047857">Hackathon</text>
      <text x="20" y="84" font-size="22" font-weight="700" fill="#111827">CICS Hackathon 2026</text>
      <text x="20" y="112" font-size="14" fill="#6b7280">48 hours of building with your friends. Food, mentors, and prizes on the line.</text>
      <g transform="translate(20, 150)" font-size="13" fill="#374151">
        <text y="0" font-weight="600">Where</text>
        <text y="26">Auditorium B, 2nd floor</text>
        <text y="56" font-weight="600">When</text>
        <text y="82">Fri Aug 7 · 3:00 PM – Sun Aug 9 · 3:00 PM</text>
      </g>
      <rect x="20" y="300" width="320" height="40" rx="20" fill="url(#accent)"/>
      <text x="180" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Add to calendar</text>
    </g>

    <g transform="translate(760, 180)">
      <text font-size="14" font-weight="700" fill="#111827">More this week</text>
      <rect y="16" width="240" height="66" rx="14" fill="#f0fdf4"/>
      <rect x="14" y="30" width="12" height="30" rx="6" fill="#14b8a6"/>
      <text x="36" y="52" font-size="13" font-weight="600" fill="#111827">Intramurals</text>
      <text x="36" y="70" font-size="12" fill="#6b7280">Mon · 8:00 AM</text>
      <rect y="94" width="240" height="66" rx="14" fill="#f0fdf4"/>
      <rect x="14" y="108" width="12" height="30" rx="6" fill="#f59e0b"/>
      <text x="36" y="130" font-size="13" font-weight="600" fill="#111827">Club fair</text>
      <text x="36" y="148" font-size="12" fill="#6b7280">Wed · 10:00 AM</text>
      <rect y="172" width="240" height="66" rx="14" fill="#f0fdf4"/>
      <rect x="14" y="186" width="12" height="30" rx="6" fill="#8b5cf6"/>
      <text x="36" y="208" font-size="13" font-weight="600" fill="#111827">Org meeting</text>
      <text x="36" y="226" font-size="12" fill="#6b7280">Thu · 4:30 PM</text>
