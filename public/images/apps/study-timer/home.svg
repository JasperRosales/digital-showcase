<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <rect x="200" y="100" width="880" height="540" rx="22" fill="#ffffff" opacity="0.98"/>
    <rect x="200" y="100" width="880" height="54" rx="22" fill="#fff7ed"/>
    <rect x="200" y="126" width="880" height="28" fill="#fff7ed"/>
    <circle cx="228" cy="127" r="7" fill="#ff5f57"/>
    <circle cx="250" cy="127" r="7" fill="#febc2e"/>
    <circle cx="272" cy="127" r="7" fill="#28c840"/>
    <rect x="560" y="116" width="170" height="22" rx="11" fill="#ffffff"/>
    <text x="645" y="132" text-anchor="middle" font-size="12" fill="#9ca3af">studytimer.app/focus</text>

    <rect x="200" y="154" width="76" height="486" fill="#fff7ed"/>
    <rect x="218" y="178" width="40" height="40" rx="12" fill="#f97316"/>
    <rect x="230" y="188" width="16" height="16" rx="4" fill="#ffffff"/>
    <rect x="218" y="234" width="40" height="40" rx="12" fill="#fed7aa" opacity="0.6"/>
    <circle cx="238" cy="254" r="7" fill="#f97316" opacity="0.7"/>
    <rect x="218" y="290" width="40" height="40" rx="12" fill="#fed7aa" opacity="0.6"/>
    <rect x="228" y="298" width="20" height="8" rx="4" fill="#f97316" opacity="0.7"/>
    <rect x="228" y="312" width="14" height="8" rx="4" fill="#f97316" opacity="0.7"/>

    <g transform="translate(350, 190)">
      <text font-size="16" font-weight="700" fill="#111827">Good evening, Juan</text>
      <text y="28" font-size="13" fill="#9ca3af">Ready for a focused session?</text>

      <circle cx="190" cy="210" r="150" fill="none" stroke="#f3f4f6" stroke-width="26"/>
      <circle cx="190" cy="210" r="150" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" stroke-dasharray="707" stroke-dashoffset="210" transform="rotate(-90 190 210)"/>
      <text x="190" y="195" text-anchor="middle" font-size="54" font-weight="700" fill="#111827">25:00</text>
      <text x="190" y="222" text-anchor="middle" font-size="14" fill="#9ca3af">Focus session</text>
      <rect x="130" y="252" width="120" height="42" rx="21" fill="url(#accent)"/>
      <text x="190" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Start</text>

      <rect x="420" y="90" width="200" height="92" rx="16" fill="#fff7ed"/>
      <text x="438" y="118" font-size="13" font-weight="600" fill="#111827">Sessions today</text>
      <text x="438" y="152" font-size="26" font-weight="700" fill="#f97316">4</text>

      <rect x="420" y="200" width="200" height="92" rx="16" fill="#fff7ed"/>
      <text x="438" y="228" font-size="13" font-weight="600" fill="#111827">Day streak</text>
      <text x="438" y="262" font-size="26" font-weight="700" fill="#f97316">7 days</text>
    </g>
  </g>
